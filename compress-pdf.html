<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Compress PDF | FixMyPDF</title>
    <meta name="description" content="Compress PDF files online for free. Reduce PDF file size securely on your device.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="pdf-state.js"></script>
    <script src="auto-loader.js"></script>
    <link rel="stylesheet" href="style.css">

    <style>
        #compression-level {
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            background: white;
            transition: all 0.2s;
            width: 100%;
        }

        #compression-level:focus {
            border-color: var(--brand-color);
        }

        .compression-info {
            background: #F8FAFC;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .compression-info strong {
            display: block;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        /* Modern Progress Bar for UX */
        .progress-container {
            width: 100%;
            background-color: var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            margin-top: 12px;
            display: none;
        }

        .progress-bar {
            width: 0%;
            height: 6px;
            background-color: var(--brand-color);
            transition: width 0.2s ease;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">
            <i class="ph-fill ph-wrench"></i>
            FixMy<span>PDF</span>
        </a>
    </nav>

    <main class="container" style="max-width: 800px; padding-top: 3rem;">

        <div class="tool-header">
            <h1>Compress PDF</h1>
            <p>Reduce PDF file size securely directly on your device while preserving document clarity.</p>
        </div>

        <div id="drop-zone" class="drop-zone">
            <i class="ph-duotone ph-upload-simple"></i>
            <h3>Choose a PDF file</h3>
            <p>or drop it here</p>
            <input type="file" id="file-input" accept="application/pdf" hidden>
        </div>

        <div id="options-panel" class="options-panel hidden">

            <div class="options-header">
                <div>
                    <h4>
                        <i class="ph-fill ph-file-pdf"></i>
                        <span id="file-name-display">filename.pdf</span>
                    </h4>

                    <span id="page-count-display" class="page-count-badge">
                        0 Pages
                    </span>
                </div>

                <div class="header-actions">
                    <button id="view-pdf-btn" class="icon-btn">
                        <i class="ph-bold ph-eye"></i>
                        View PDF
                    </button>

                    <button id="remove-file-btn" class="icon-btn danger">
                        <i class="ph-bold ph-trash"></i>
                        Remove
                    </button>
                </div>
            </div>

            <div class="compression-info">
                <strong>Compression Strategy</strong>
                Adjust settings to balance crisp rendering sharpness against total file output target.
            </div>

            <div class="input-group">
                <label for="compression-level">Compression Level</label>
                <select id="compression-level">
                    <option value="low">High Quality (Slight Compression / Sharpest Text)</option>
                    <option value="medium" selected>Balanced Compression (Recommended Balance)</option>
                    <option value="high">Strong Compression (Smallest File Size / Minor Blur)</option>
                </select>
            </div>

            <button id="compress-btn" class="action-btn">
                Compress PDF
                <i class="ph-bold ph-arrows-in"></i>
            </button>

             <!-- Apply Changes & Continue Editing Button -->
<div style="display: flex; gap: 12px; margin-top: 16px;">
    <button id="apply-and-continue-btn" class="action-btn" style="background: #3B82F6; width: 100%;">
        <i class="ph-bold ph-share-network"></i> Apply Changes & Continue Editing
    </button>
</div>

            <div id="progress-container" class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <p id="status-message" style="margin-top: 12px; font-weight: 500;"></p>

        </div>

    </main>

    <div id="pdf-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>
                    <i class="ph-fill ph-file-pdf" style="color: var(--brand-color);"></i>
                    Document Preview
                </h3>
                <button id="close-modal-btn" class="close-modal-btn">
                    <i class="ph-bold ph-x"></i>
                </button>
            </div>
            <iframe id="pdf-preview-frame" class="pdf-frame" src=""></iframe>
        </div>
    </div>

    <script src="compress.js"></script>

</body>
</html>
