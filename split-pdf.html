<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split PDF | FixMyPDF</title>
    <meta name="description" content="Extract specific pages from your PDF securely and privately.">
    
    <!-- Premium Fonts and Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="pdf-state.js"></script>
    <script src="auto-loader.js"></script>
    
    <!-- PDF Engine -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <a href="index.html" class="logo">
            <i class="ph-fill ph-wrench"></i>
            FixMy<span>PDF</span>
        </a>
    </nav>

    <!-- Main Tool Workspace -->
    <main class="container" style="max-width: 800px; padding-top: 3rem;">
        
        <div class="tool-header">
            <h1>Split PDF</h1>
            <p>Extract the exact pages you need from your PDF.</p>
        </div>

        <!-- Step 1: Upload (Visible initially) -->
        <div id="drop-zone" class="drop-zone">
            <i class="ph-duotone ph-upload-simple"></i>
            <h3>Choose a PDF file</h3>
            <p>or drop it here</p>
            <input type="file" id="file-input" accept="application/pdf" hidden>
        </div>

        <!-- Step 2: Configuration (Hidden until file is uploaded) -->
        <div id="options-panel" class="options-panel hidden">
            
            <!-- File Info and Utility Buttons -->
            <div class="options-header">
                <div>
                    <h4><i class="ph-fill ph-file-pdf"></i> <span id="file-name-display">filename.pdf</span></h4>
                    <span id="page-count-display" class="page-count-badge">0 Pages</span>
                </div>
                
                <!-- View and Remove Buttons -->
                <div class="header-actions">
                    <button id="view-pdf-btn" class="icon-btn">
                        <i class="ph-bold ph-eye"></i> View PDF
                    </button>
                    <button id="remove-file-btn" class="icon-btn danger" title="Remove File">
                        <i class="ph-bold ph-trash"></i> Remove
                    </button>
                </div>
            </div>
            
            <!-- Input Area -->
            <div class="input-group">
                <label for="page-range">Pages to Extract:</label>
                <input type="text" id="page-range" placeholder="e.g., 1, 3, 5-10">
                <p class="helper-text">Type page numbers and/or ranges separated by commas. (Click "View PDF" to check page numbers!)</p>
            </div>

            <!-- Action Button -->
            <button id="split-btn" class="action-btn">
                Split PDF <i class="ph-bold ph-scissors"></i>
            </button>
            <p id="status-message"></p>
        </div>

    </main>

    <!-- The PDF Preview Modal Popup (Hidden by default) -->
    <div id="pdf-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="ph-fill ph-file-pdf" style="color: var(--brand-color);"></i> Document Preview</h3>
                <button id="close-modal-btn" class="close-modal-btn" title="Close Preview"><i class="ph-bold ph-x"></i></button>
            </div>
            <!-- The iframe securely displays the PDF using the browser's native viewer -->
            <iframe id="pdf-preview-frame" class="pdf-frame" src=""></iframe>
        </div>
    </div>

    <!-- Links to the split logic -->
    <script src="split.js"></script>
</body>
</html>
